    /* The original photograph layers and close-up camera are unchanged. */
.home-page .samosa-diagram { --spread: 0; width: 100%; margin: 36px auto 0; text-align: center; }

.home-page .samosa-diagram__stage {
    position: relative;
    width: min(100%, 640px);
    aspect-ratio: 800 / 650;
    margin: 0 auto;
    isolation: isolate;

    border-radius: 24px;
}
.home-page .samosa-diagram__art { display: block; width: 100%; height: 100%; overflow: visible; }
.home-page .samosa-diagram__camera {
    /* A fixed origin keeps both close-ups smooth when returning to the full view. */
    transform-origin: 340px 435px;
    transform: translate(0, 0) scale(1);
    transition: transform 1000ms cubic-bezier(.22,.75,.18,1);
}
.home-page .samosa-diagram[data-closeup="fold"] .samosa-diagram__camera { transform: translate(160px, -110px) scale(2.8); }
.home-page .samosa-diagram[data-closeup="salsa"] .samosa-diagram__camera { transform: translate(-834px, -194px) scale(2.8); }
.home-page .samosa-diagram__shadow { transition: opacity 400ms; }

.home-page .samosa-diagram[data-closeup="fold"] .samosa-diagram__salsa,
.home-page .samosa-diagram[data-closeup="salsa"] .samosa-diagram__shadow,
.home-page .samosa-diagram[data-closeup="salsa"] .samosa-diagram__shell,
.home-page .samosa-diagram[data-closeup="salsa"] .samosa-diagram__fold { opacity: 0; }
.home-page .samosa-diagram__piece {
    transform-origin: 435px 310px;
    transition: transform 850ms cubic-bezier(.22,.75,.18,1), opacity 600ms;
}
.home-page .samosa-diagram__shell { transform: translate(calc(var(--spread) * -140px), calc(var(--spread) * -45px)) scale(calc(1 - var(--spread) * .16)); }

  <script>
    (() => {
    const root = document.getElementById('steak-insides-preview');
    const diagram = root.querySelector('[data-samosa-diagram]');
    if (!diagram) return;

    // Product language follows the Burlington menu. The Flutter app still has
    // its starter screen and has no product-detail component to share here.
    const parts = [
        { id: 'fold', title: 'A personal touch.', description: 'Folded by hand. One samosa at a time.' },
        { id: 'filling', title: 'Goodness inside.', description: 'Our Steak and Cheese filling: tender minced beef, sharp cheese, onion, and spices.' },
        { id: 'salsa', title: 'Better together.', description: 'Tomato Garlic Chutney, made to bring out the boldness of flavor in the samosa.' },
    ];
    const stage = diagram.querySelector('.samosa-diagram__stage');
    const hotspots = diagram.querySelector('[data-diagram-hotspots]');
    const points = [...diagram.querySelectorAll('[data-diagram-part]')];
    const caption = diagram.querySelector('[data-diagram-caption]');
    const title = caption.querySelector('h3');
    const description = caption.querySelector('p');
    const toggle = diagram.querySelector('[data-diagram-toggle]');
    const whole = diagram.querySelector('[data-diagram-whole]');
    const controls = diagram.querySelector('[data-diagram-controls]');
    let inside = false;
    let selected = null;
    let returnFocus = toggle;

    const selectPart = (id) => {
        selected = id;
        const detailOpen = id !== null;
        const closeup = id === 'fold' || id === 'salsa';
        const expanded = id === 'filling';

        diagram.dataset.detailOpen = String(detailOpen);
        diagram.dataset.closeup = closeup ? id : '';
        diagram.style.setProperty('--spread', Number(expanded));
        hotspots.hidden = !inside;
        hotspots.inert = !inside;
        hotspots.setAttribute('aria-hidden', String(!inside));
        stage.setAttribute('aria-label', id === 'fold'
            ? 'A closer look at the samosa’s hand-folded edge'
            : id === 'salsa'
                ? 'A closer look at the Garlic Tomato Salsa'
                : 'Explore the parts of a samosa');
        controls.dataset.state = inside ? 'inside' : 'whole';
        toggle.setAttribute('aria-pressed', String(inside));
        whole.setAttribute('aria-pressed', String(!inside));

        const part = parts.find((item) => item.id === id);
        points.forEach((point) => {
            point.setAttribute('aria-pressed', String(point.dataset.diagramPart === id));
            point.hidden = closeup && point.dataset.diagramPart !== id;
        });
        caption.classList.toggle('is-idle', !part);
        title.hidden = !part;
        title.textContent = part?.title || '';
        description.textContent = part?.description || 'Select + for a closer look.';
        description.hidden = !inside;
    };

    const leaveDetail = ({ restoreFocus = true } = {}) => {
        selectPart(null);
        if (restoreFocus) returnFocus.focus({ preventScroll: true });
    };

    points.forEach((point, index) => {
        point.addEventListener('click', () => {
            returnFocus = point;
            selectPart(selected === point.dataset.diagramPart ? null : point.dataset.diagramPart);
        });
        point.addEventListener('keydown', (event) => {
            const offsets = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
            if (!(event.key in offsets)) return;
            event.preventDefault();
            const next = points[(index + offsets[event.key] + points.length) % points.length];
            returnFocus = next;
            selectPart(next.dataset.diagramPart);
            next.focus({ preventScroll: true });
        });
    });
    toggle.addEventListener('click', () => {
        inside = true;
        returnFocus = toggle;
        selectPart('filling');
    });
    whole.addEventListener('click', () => {
        inside = false;
        leaveDetail({ restoreFocus: false });
    });
    diagram.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape' || !selected) return;
        event.preventDefault();
        leaveDetail();
    });
    // Capture checks the state before an opening control handles its click.
    // The return button keeps its own click and focus behavior.
    document.addEventListener('click', (event) => {
        if (!selected || diagram.contains(event.target)) return;
        leaveDetail({ restoreFocus: false });
    }, { capture: true });

    const fallback = root.querySelector('[data-diagram-fallback]');
    selectPart(null);
    if (fallback) fallback.hidden = true;
    diagram.hidden = false;
})();

  </script>
