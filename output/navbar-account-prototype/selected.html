<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Selected navbar · Mobile and desktop</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#e9e5dc;color:#27261f;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}main{padding:20px 18px;display:flex;align-items:center;flex-direction:column;gap:16px}header{width:min(1200px,100%);display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:18px;font-weight:600;margin:0 0 6px}p{margin:0;font-size:12px;color:#68645b}nav{display:flex;padding:4px;background:#d9d3c7;border-radius:12px;gap:4px}button,select,input{font:inherit}button{border:0;background:transparent;border-radius:8px;padding:10px 16px;color:inherit;cursor:pointer;font-size:13px}button[aria-pressed=true]{background:#fffdf8;box-shadow:0 1px 4px #0001}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b94316;outline-offset:3px}.frame{width:min(1200px,100%);height:calc(100dvh - 170px);min-height:480px;max-height:844px;border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px #27261f25,0 15px 48px #27261f20;background:#f7f3ea}iframe{display:block;width:100%;height:100%;border:0}.fixture{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;font-size:12px;color:#68645b}.fixture label{display:flex;align-items:center;gap:6px}input[type=text]{width:130px;border:0;border-bottom:1px solid #a69d8d;background:transparent;color:#27261f;padding:5px}select{padding:5px;border:1px solid #c3bcae;background:#f7f3ea;border-radius:5px}@media(max-width:600px){main{padding:16px 12px}header{align-items:flex-start;flex-direction:column;gap:12px}.frame{height:calc(100dvh - 240px)}h1{font-size:16px}}
</style></head><body><main>
<header><div><h1>Your selected navbar</h1><p>Mobile: My account · Desktop: initial circle</p></div><nav aria-label="Preview size"><button type="button" data-view="desktop" aria-pressed="true">Desktop</button><button type="button" data-view="mobile" aria-pressed="false">Mobile</button></nav></header>
<div class="frame"><iframe id="selected-frame" src="selected-frame.html" title="Selected navbar with a sample account"></iframe></div>
<div class="fixture"><label>Sample name <input id="sample-name" type="text" value="Hakeem" maxlength="60"></label><label><input id="signed-in" type="checkbox" checked>Signed in</label><label><input id="compact" type="checkbox" checked>Compact navbar</label><label>Width <select id="width"><option value="1200">1200 px</option><option value="1440">1440 px</option><option value="981">981 px</option><option value="980">980 px</option><option value="390">390 px</option><option value="320">320 px</option></select></label></div>
<p>Local preview · Sample account · Not published</p>
</main><script>
const frame=document.querySelector('#selected-frame');
const widthSelect=document.querySelector('#width');
function sendState(){frame.contentWindow.postMessage({type:'selected-preview',name:document.querySelector('#sample-name').value,signedIn:document.querySelector('#signed-in').checked,compact:document.querySelector('#compact').checked},location.origin)}
function setWidth(value){widthSelect.value=String(value);document.querySelector('.frame').style.width=`min(${value}px,100%)`;document.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String((value<=980?'mobile':'desktop')===button.dataset.view)));const url=new URL(location.href);url.searchParams.set('width',String(value));history.replaceState(null,'',url)}
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>setWidth(button.dataset.view==='mobile'?390:1200)));
widthSelect.addEventListener('change',()=>setWidth(Number(widthSelect.value)));
document.querySelectorAll('.fixture input').forEach(input=>input.addEventListener('input',sendState));
frame.addEventListener('load',sendState);
const initialWidth=Number(new URLSearchParams(location.search).get('width'));
setWidth([320,390,980,981,1200,1440].includes(initialWidth)?initialWidth:1200);
</script></body></html>
