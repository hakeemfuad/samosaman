<script>
// Local-only authentication fixture. The production navbar and auth files render the control.
const callbacks = [];
const auth = { currentUser: {displayName:'Hakeem'}, onAuthStateChanged(callback) { callbacks.push(callback); callback(this.currentUser); } };
const firebase = { auth: () => auth };
window.addEventListener('message', event => {
 if(event.origin !== location.origin || event.source !== parent || event.data?.type !== 'selected-preview') return;
 auth.currentUser = event.data.signedIn ? {displayName:String(event.data.name || '')} : null;
 callbacks.forEach(callback => callback(auth.currentUser));
 document.querySelector('#glass-nav').classList.toggle('is-compact', Boolean(event.data.compact));
 document.querySelector('#auth-modal')?.classList.add('hidden');
 document.querySelector('#preview-feedback').hidden = true;
});
</script><script src="js/navbar.js?v=20261020-responsive-account"></script><script src="js/auth.js?v=20261020-responsive-account"></script>
